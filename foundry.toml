# Repo-root layout: the three protocol packages each keep their own contracts/
# directory, so Foundry must treat the whole repo as the source tree.
# See CLAUDE.md, "Repo layout". Split into per-protocol profiles if this gets slow.
[profile.default]
src = "."
test = "."
script = "script"
out = "out"
libs = ["dependencies"]

# Pinned for reproducibility: gas figures depend on the compiler and the
# optimizer settings, so both are reported in the thesis methodology.
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

# Keep `test = "."` from collecting the vendored dependency tree's own tests.
no_match_path = "dependencies/**"

# `src = "."` puts the vendored dependencies in the lint path too, and their
# warnings would bury ours on every build. Lint explicitly on our own contracts
# instead:  forge lint shared/contracts p1_erc5564 p2_mlwe p3_hybrid
[lint]
lint_on_build = false
# DOMAIN_SEPARATOR is EIP-712's own spelling and appears in the verbatim
# ERC-6538 port. Renaming it would break both convention and fidelity.
mixed_case_exceptions = ["ERC", "DOMAIN_SEPARATOR"]

# Contract sizes and gas snapshots are regression aids only. Authoritative gas
# numbers come from real testnet receipts (bench/gas.py) — Foundry's internal
# metering excludes the 21k intrinsic cost and per-byte calldata cost, which is
# exactly the component that differs between P1/P2/P3.
gas_reports = ["*"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
eth_sepolia = "${ETH_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
eth_sepolia = {key = "${ETHERSCAN_API_KEY}", chain = 11155111}
base_sepolia = {key = "${BASESCAN_API_KEY}", chain = 84532}
